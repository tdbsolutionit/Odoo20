name: Odoo 20 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------------------------------
  # 1. CI: LINT & CODE VALIDATION
  # --------------------------------------------------------------------------
  lint-and-validate:
    name: Syntax & Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Verify Python Syntax Across Custom Addons
        run: |
          python -m compileall custom_addons/
          python -m compileall addons/dms/

      - name: Validate Custom Module Manifests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import ast, glob, sys
          errors = 0
          for manifest in glob.glob('custom_addons/**/__manifest__.py', recursive=True):
              try:
                  with open(manifest, 'r', encoding='utf-8') as f:
                      data = ast.literal_eval(f.read())
                      assert isinstance(data, dict), 'Manifest must be a dict'
                      assert 'name' in data, 'Missing name in manifest'
                      name = data.get('name')
                      print(f'Validated: {manifest} ({name})')
              except Exception as e:
                  print(f'Error in {manifest}: {e}', file=sys.stderr)
                  errors += 1
          if errors:
              sys.exit(1)
          "

  # --------------------------------------------------------------------------
  # 2. CI: DOCKER IMAGE BUILD TEST
  # --------------------------------------------------------------------------
  docker-build-test:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: odoo:20.0-custom
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 3. CD: DEPLOY TO PRODUCTION (Template / Example)
  # --------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [lint-and-validate, docker-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Announce Deployment
        run: |
          echo "CI checks passed successfully. Ready for deployment."
          echo "To enable auto-deploy via SSH, configure secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY"

      # Để bật tự động Deploy lên VPS qua SSH:
